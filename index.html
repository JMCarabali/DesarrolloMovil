<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ed" />
    <meta name="description" content="Completa retos, suma puntos y avanza en el ranking UAO." />
    <title>Misiones UAO</title>
    <style>
      html, body, #root { min-width: 320px; min-height: 100%; margin: 0; }
      body { background: #f6f3ed; color: #183237; font-family: Arial, sans-serif; }
      .startup-splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; }
      .startup-brand { color: #db2938; font: 700 48px/1 Arial, sans-serif; letter-spacing: -4px; }
      .startup-status { display: flex; align-items: center; gap: 9px; color: #778486; font-size: 13px; }
      .startup-spinner { width: 15px; height: 15px; border: 2px solid #dfded7; border-top-color: #db2938; border-radius: 50%; animation: startup-spin .8s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body><div id="root"><main class="startup-splash" role="status"><span class="startup-brand">uao</span><span class="startup-status"><span class="startup-spinner"></span>Preparando tu recorrido</span></main></div><script type="module" src="/src/main.jsx"></script></body>
</html>
